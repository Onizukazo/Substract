<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Substract — AI Subscription Manager</title>
  <meta name="description" content="Substract: AI-powered subscription management. Track, cancel, and save on your subscriptions effortlessly." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
          colors: {
            brand: '#10b981',
            navy: '#0f172a',
            'navy-light': '#1e293b',
          }
        }
      }
    }
  </script>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>window.react = window.React;</script>
  <script crossorigin="anonymous" src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: #0f172a; display: flex; justify-content: center; align-items: center; }

    /* ── Phone Frame ── */
    #root {
      width: 100%; height: 100%;
      max-width: 390px;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }
    @media (min-width: 431px) {
      #root {
        height: 85vh;
        max-height: 780px;
        border-radius: 44px;
        border: 6px solid #1e293b;
        box-shadow: 0 0 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      }
    }

    /* ── Scrollbar Hide ── */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Animations ── */
    .fade-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .slide-up { animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .slide-up-full { animation: slideUpFull 0.35s cubic-bezier(0.16,1,0.3,1); }
    @keyframes slideUpFull { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .scale-in { animation: scaleIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }

    .glow-text { animation: glowPulse 2s ease-in-out infinite; }
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.3); }
      50% { text-shadow: 0 0 40px rgba(255,255,255,0.6), 0 0 80px rgba(255,255,255,0.2); }
    }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse-ring { animation: pulseRing 2s ease-out infinite; }
    @keyframes pulseRing {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* ── Focus Rings ── */
    input:focus { outline: none; border-color: #10b981 !important; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
